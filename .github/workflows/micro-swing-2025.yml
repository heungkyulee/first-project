name: hydra-micro-swing-2025
on:
  pull_request:
    paths:
      - 'micro/swing_2025.py'
      - '.github/workflows/micro-swing-2025.yml'
  workflow_dispatch:

jobs:
  swing:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy requests scikit-learn pyarrow tabulate
      - name: Run micro-to-minute test
        run: python micro/swing_2025.py
      - name: Show result
        if: always()
        run: cat micro_swing25_${ASSET}/SUMMARY.md || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-swing25-${{ matrix.asset }}
          path: micro_swing25_${{ matrix.asset }}/
          if-no-files-found: warn
          retention-days: 7
