name: hydra-micro-probe
on:
  pull_request:
    paths:
      - 'micro/**'
      - '.github/workflows/micro-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests pandas numpy scikit-learn pyarrow
      - name: Run micro probe
        run: python micro/probe.py
      - name: Show result
        if: always()
        run: cat micro_results/probe.json || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-probe-results
          path: micro_results/
          if-no-files-found: warn
          retention-days: 7
