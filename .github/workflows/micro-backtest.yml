name: hydra-micro-backtest
on:
  pull_request:
    paths:
      - 'micro/backtest_micro.py'
      - '.github/workflows/micro-backtest.yml'
  workflow_dispatch:

jobs:
  micro:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy requests scikit-learn pyarrow
      - name: Run HYDRA Micro
        run: python micro/backtest_micro.py
      - name: Show compact results
        if: always()
        run: |
          cat micro_results_${ASSET}/SUMMARY.md || true
          cat micro_results_${ASSET}/classification.csv || true
          cat micro_results_${ASSET}/trading_primary.csv || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-${{ matrix.asset }}
          path: micro_results_${{ matrix.asset }}/
          if-no-files-found: warn
          retention-days: 7
