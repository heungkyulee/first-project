name: hydra-micro-economic
on:
  pull_request:
    paths:
      - 'micro/economic.py'
      - '.github/workflows/micro-economic.yml'
  workflow_dispatch:

jobs:
  economic:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy requests scikit-learn pyarrow tabulate
      - name: Run economic-move test
        run: python micro/economic.py
      - name: Show result
        if: always()
        run: cat micro_econ_${ASSET}/SUMMARY.md || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-econ-${{ matrix.asset }}
          path: micro_econ_${{ matrix.asset }}/
          if-no-files-found: warn
          retention-days: 7
